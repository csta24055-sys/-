name: Math IR Efficient - One Job and Variable Cases

on:
  pull_request:
    paths:
      - 'math_tools_v2/**'
      - '.github/workflows/math-ir-efficient.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "Run full 7 engines, Python only, or legacy 43-node verification"
        required: true
        default: portable-full
        options:
          - portable-full
          - portable-python
          - baseline-compact
          - lca-operators
      case_file:
        type: string
        description: "Public fixture in math_tools_v2/examples/ for portable modes"
        required: true
        default: 'math_tools_v2/examples/six_cases.json'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MATH_MODE: ${{ inputs.mode || 'portable-full' }}
      MATH_INPUT_FILE: ${{ inputs.case_file || 'math_tools_v2/examples/six_cases.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python libraries once
        run: python -m pip install --disable-pip-version-check -r math_tools_v2/requirements.txt
      - name: Validate selected input and prepare Python DAG
        shell: bash
        run: |
          set -euo pipefail
          case "$MATH_MODE" in portable-full|portable-python|baseline-compact|lca-operators) ;; *) echo 'Invalid mode'; exit 2 ;; esac
          if [ "$MATH_MODE" = lca-operators ] && [ "$MATH_INPUT_FILE" = math_tools_v2/examples/six_cases.json ]; then
            MATH_INPUT_FILE=math_tools_v2/examples/lca_ops_demo.json
            echo "MATH_INPUT_FILE=$MATH_INPUT_FILE" >> "$GITHUB_ENV"
          fi
          if ! [[ "$MATH_INPUT_FILE" =~ ^math_tools_v2/examples/[A-Za-z0-9_-]+\.json$ ]]; then
            echo 'Only a direct public fixture in math_tools_v2/examples/ is allowed (no traversal)'; exit 2
          fi
          test -f "$MATH_INPUT_FILE"
          if [ "$MATH_MODE" = lca-operators ]; then
            mkdir -p math_ir_io
            python -m unittest discover -s math_tools_v2 -p 'test_lca_ops.py' -v
            python math_tools_v2/lca_ops.py run "$MATH_INPUT_FILE" math_ir_io/result.json
            python math_tools_v2/lca_ops.py verify "$MATH_INPUT_FILE" math_ir_io/result.json
          elif [ "$MATH_MODE" = baseline-compact ]; then
            python math_interop_v0/phase5.py prepare math_ir_io
          else
            python math_tools_v2/portable.py prepare "$MATH_INPUT_FILE" math_ir_io
            if [ "$MATH_MODE" = portable-full ]; then
              # Test all five Python engines BEFORE SageMath/MATLAB are started.
              python math_tools_v2/portable.py verify-python math_ir_io
              python math_tools_v2/portable.py audit-python math_ir_io
            fi
          fi
      - name: Run SageMath 10.10 (only when requested)
        if: ${{ env.MATH_MODE != 'portable-python' && env.MATH_MODE != 'lca-operators' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --entrypoint /bin/bash \
            sagemath/sagemath:10.10 \
            -lc 'export PATH="/home/sage/sage/local/bin:$PATH"; exec sage -python /work/math_interop_v0/phase1.py sage' \
            < math_ir_io/input.json > math_ir_io/sage_result.json
      - name: Install MATLAB and Symbolic Math Toolbox (only when requested)
        if: ${{ env.MATH_MODE != 'portable-python' && env.MATH_MODE != 'lca-operators' }}
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Symbolic_Math_Toolbox
      - name: Independently evaluate in MATLAB, reading SageMath JSON
        if: ${{ env.MATH_MODE != 'portable-python' && env.MATH_MODE != 'lca-operators' }}
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'math_interop_v0')); phase3_matlab"
      - name: Finalize and audit
        shell: bash
        run: |
          set -euo pipefail
          case "$MATH_MODE" in
            lca-operators)
              python math_tools_v2/lca_ops.py verify "$MATH_INPUT_FILE" math_ir_io/result.json
              ;;
            baseline-compact)
              python math_interop_v0/phase5.py finalize math_ir_io
              python math_interop_v0/phase5.py audit math_ir_io
              ;;
            portable-full)
              python math_tools_v2/portable.py verify-full math_ir_io
              python math_tools_v2/portable.py audit-full math_ir_io
              ;;
            portable-python)
              python math_tools_v2/portable.py verify-python math_ir_io
              python math_tools_v2/portable.py audit-python math_ir_io
              ;;
          esac
          {
            echo '### Math IR efficient run'
            echo "Mode: $MATH_MODE"
            echo "Case fixture: $MATH_INPUT_FILE"
            echo 'All required tests passed; optional Dropbox backup; NO GitHub Actions artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Copy computation outputs to Dropbox (no GitHub artifact quota)
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets not configured; outputs were NOT archived. No GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          for file in \
            math_ir_io/result.json \\
            math_ir_io/unified_graph.json; do
            if [[ -f "$file" ]]; then
              python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$(basename "$file")"
              count=$((count+1))
            fi
          done
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then echo '::warning::No result files found to copy'; fi
