name: SageMath Run

on:
  workflow_dispatch:
    inputs:
      command:
        description: "SageMath command to run (Sage syntax)"
        required: true
        default: "x = var('x'); print(integrate(x^2*sin(x), x))"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run SageMath command in the official container
        shell: bash
        env:
          SAGE_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          {
            echo '=== RESULT BEGIN ==='
            docker run --rm \
              -e SAGE_COMMAND \
              --entrypoint /bin/bash \
              sagemath/sagemath:10.10 \
              -lc 'export PATH="/home/sage/sage/local/bin:$PATH"; exec sage -c "$SAGE_COMMAND"'
            echo '=== RESULT END ==='
          } 2>&1 | tee sage_output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sagemath-output
          path: sage_output.txt
          if-no-files-found: ignore
