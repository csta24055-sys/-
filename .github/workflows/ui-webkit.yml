# 5 種類の UI レイアウトを WebKit（Safari と同じ系統のエンジン）で確かめる。
# Playwright の WebKit を macOS 上で動かし、iPhone 13 相当の画面で e2e/final-checks.cjs と e2e/ui-layouts.cjs を実行する。
# これは端末のエミュレーションで、iPhone / iPad の実機の Safari そのものの確認ではない（ホーム画面から起動したときの
# ステータスバーや安全領域の実際の値は実機でしか分からない）。公開はしない。
name: ui-webkit

on:
  workflow_dispatch:
  push:
    branches: ["claude/multi-ui-design-system-l5isn2", "claude/air-quality-research-os-19gu2g"]
    paths: ["frontend/src/**", "frontend/e2e/**", "frontend/index.html", "scripts/build_mobile.py", "scripts/serve_static.py", ".github/workflows/ui-webkit.yml"]

permissions:
  contents: read

concurrency:
  group: ui-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Install
        run: |
          brew install poppler > /dev/null   # 漏えい検査で PDF の本文を読む
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npm i --no-save playwright@1.63.0 && npx playwright install webkit
      - name: Build mobile PWA + leak scan
        env:
          AQROS_PRIVACY_PATTERNS: ${{ secrets.AQROS_PRIVACY_PATTERNS }}
        run: |
          python scripts/build_mobile.py --base /
          python scripts/build_mobile.py --target cloudflare --out frontend/dist-cf
      - name: Final checks (WebKit)
        run: |
          python scripts/serve_static.py frontend/dist-mobile 47801 &
          sleep 1
          cd frontend && BROWSER=webkit OUT=../webkit-out/final WORKER=dist-cf/_worker.js node e2e/final-checks.cjs
      - name: Layout matrix — 5 layouts × desktop / iPhone / Android (WebKit)
        if: always()
        run: |
          curl -s -o /dev/null http://127.0.0.1:47801/ || (python scripts/serve_static.py frontend/dist-mobile 47801 & sleep 1)
          cd frontend && BROWSER=webkit SHOTS=../webkit-out/ui-layouts node e2e/ui-layouts.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-webkit
          path: webkit-out
          retention-days: 14
