name: Dropbox OAuth auto-registration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight (check setup) or exchange (save refresh token)'
        required: true
        type: choice
        options:
          - preflight
          - exchange
        default: preflight

permissions:
  contents: read

concurrency:
  group: dropbox-oauth-registration
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sealed-box crypto helper
        run: python -m pip install --disable-pip-version-check --quiet 'PyNaCl==1.5.0'
      - name: Check credentials or exchange short-lived authorization code
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_AUTH_CODE: ${{ secrets.DROPBOX_AUTH_CODE }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python -B scripts/dropbox_auth_manage.py "${{ inputs.mode }}"
