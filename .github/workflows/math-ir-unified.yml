name: Math IR Unified Seven Engines - One Traceable DAG

on:
  pull_request:
    paths:
      - 'math_interop_v0/phase5.py'
      - 'math_interop_v0/README-unified.md'
      - '.github/workflows/math-ir-unified.yml'
      - 'math_interop_v0/phase1.py'
      - 'math_interop_v0/phase2.py'
      - 'math_interop_v0/phase3.py'
      - 'math_interop_v0/phase3_matlab.m'
      - 'math_interop_v0/phase4.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-five:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible five Python math engines
        run: |
          python -m pip install --disable-pip-version-check \
            'sympy==1.14.0' 'numpy==2.2.6' 'scipy==1.15.3' \
            'mpmath==1.3.0' 'duckdb==1.4.1'
      - name: Build and store canonical 27-node Python DAG and shared Math IR
        run: python math_interop_v0/phase5.py prepare math_ir_io
      - name: Share tiny synthetic inputs and content-addressed cache
        uses: actions/upload-artifact@v4
        with:
          name: seven-engine-python-input
          path: math_ir_io/
          if-no-files-found: error
          retention-days: 1

  sage:
    needs: python-five
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seven-engine-python-input
          path: math_ir_io
      - name: Execute real SageMath 10.10 using canonical JSON (not model text)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --entrypoint /bin/bash \
            sagemath/sagemath:10.10 \
            -lc 'export PATH="/home/sage/sage/local/bin:$PATH"; exec sage -python /work/math_interop_v0/phase1.py sage' \
            < math_ir_io/input.json > math_ir_io/sage_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: seven-engine-sagemath-result
          path: math_ir_io/sage_result.json
          if-no-files-found: error
          retention-days: 1

  matlab:
    needs: [python-five, sage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seven-engine-python-input
          path: math_ir_io
      - uses: actions/download-artifact@v4
        with:
          name: seven-engine-sagemath-result
          path: math_ir_io
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Symbolic_Math_Toolbox
      - name: Import SageMath result JSON and compute independently in MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'math_interop_v0')); phase3_matlab"
      - uses: actions/upload-artifact@v4
        with:
          name: seven-engine-matlab-result
          path: math_ir_io/matlab_result.json
          if-no-files-found: error
          retention-days: 1

  unified-verify:
    needs: [python-five, sage, matlab]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install identical Python engine versions
        run: |
          python -m pip install --disable-pip-version-check \
            'sympy==1.14.0' 'numpy==2.2.6' 'scipy==1.15.3' \
            'mpmath==1.3.0' 'duckdb==1.4.1'
      - uses: actions/download-artifact@v4
        with:
          name: seven-engine-python-input
          path: math_ir_io
      - uses: actions/download-artifact@v4
        with:
          name: seven-engine-sagemath-result
          path: math_ir_io
      - uses: actions/download-artifact@v4
        with:
          name: seven-engine-matlab-result
          path: math_ir_io
      - name: Independently verify original SageMath-MATLAB data handoff
        run: |
          python math_interop_v0/phase3.py verify math_ir_io
          python math_interop_v0/phase3.py negative math_ir_io
      - name: Merge actual seven-engine output into one content-addressed DAG
        run: python math_interop_v0/phase5.py finalize math_ir_io
      - name: Verify graph in NEW process and reject nine tampering scenarios
        run: python math_interop_v0/phase5.py audit math_ir_io
      - name: Keep only small unified graph (one-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-engine-unified-graph
          path: math_ir_io/unified_graph.json
          if-no-files-found: ignore
          retention-days: 1
