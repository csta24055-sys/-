name: Math IR Unified Seven Engines - One Traceable DAG

on:
  pull_request:
    paths:
      - 'math_interop_v0/phase5.py'
      - 'math_interop_v0/README-unified.md'
      - '.github/workflows/math-ir-unified.yml'
      - 'math_interop_v0/phase1.py'
      - 'math_interop_v0/phase2.py'
      - 'math_interop_v0/phase3.py'
      - 'math_interop_v0/phase3_matlab.m'
      - 'math_interop_v0/phase4.py'
      - 'scripts/dropbox_actions_store.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible five Python math engines
        run: |
          python -m pip install --disable-pip-version-check \
            'sympy==1.14.0' 'numpy==2.2.6' 'scipy==1.15.3' \
            'mpmath==1.3.0' 'duckdb==1.4.1'
      - name: Prepare canonical Python DAG and shared Math IR
        run: python math_interop_v0/phase5.py prepare math_ir_io
      - name: Evaluate exact SageMath results from canonical JSON
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --entrypoint /bin/bash \
            sagemath/sagemath:10.10 \
            -lc 'export PATH="/home/sage/sage/local/bin:$PATH"; exec sage -python /work/math_interop_v0/phase1.py sage' \
            < math_ir_io/input.json > math_ir_io/sage_result.json
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Symbolic_Math_Toolbox
      - name: Independently compute MATLAB results using SageMath JSON
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'math_interop_v0')); phase3_matlab"
      - name: Verify original SageMath-MATLAB data handoff
        run: |
          python math_interop_v0/phase3.py verify math_ir_io
          python math_interop_v0/phase3.py negative math_ir_io
      - name: Finalize and independently audit seven-engine graph
        run: |
          python math_interop_v0/phase5.py finalize math_ir_io
          python math_interop_v0/phase5.py audit math_ir_io
      - name: Save complete synthetic output to Dropbox
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets missing; no outputs archived; no GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          while IFS= read -r -d '' file; do
            python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$file"
            count=$((count+1))
          done < <(find math_ir_io -type f -print0)
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
