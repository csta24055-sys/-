name: Math IR Phase 1 - SymPy SageMath Exact Transfer

on:
  pull_request:
    paths:
      - "math_interop_v0/**"
      - ".github/workflows/math-ir-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-exact-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out independent math-interop files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned SymPy for test
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'

      - name: Validate schema fail-closed cases and create exact input
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase1.py self-test
          python math_interop_v0/phase1.py produce "$RUNNER_TEMP/math-ir-input.json"

      - name: Execute exact rational tests in SageMath 10.10 Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --entrypoint /bin/bash \
            sagemath/sagemath:10.10 \
            -lc 'export PATH="/home/sage/sage/local/bin:$PATH"; exec sage -python /work/math_interop_v0/phase1.py sage' \
            < "$RUNNER_TEMP/math-ir-input.json" \
            > "$RUNNER_TEMP/math-ir-output.json"

      - name: Verify SymPy-SageMath roundtrip and exact metadata
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase1.py verify \
            "$RUNNER_TEMP/math-ir-input.json" \
            "$RUNNER_TEMP/math-ir-output.json"

      - name: Reject tampered results and metadata
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase1.py tamper-test \
            "$RUNNER_TEMP/math-ir-input.json" \
            "$RUNNER_TEMP/math-ir-output.json"

      - name: Copy computation outputs to Dropbox (no GitHub artifact quota)
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets not configured; outputs were NOT archived. No GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          files=(
            "$RUNNER_TEMP/math-ir-input.json"
            "$RUNNER_TEMP/math-ir-output.json"
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$(basename "$file")"
              count=$((count+1))
            fi
          done
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then echo '::warning::No result files found to copy'; fi
