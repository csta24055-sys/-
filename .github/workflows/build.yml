name: Test and build desktop installers (unsigned)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'claude/**']
    paths: ['app/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Install Chromium for the browser-preview E2E test
        run: npx playwright-core install --with-deps chromium
      - name: GUI end-to-end tests (Electron + browser preview)
        run: xvfb-run -a npm run test:e2e
        env:
          TAJIMA_SCREENSHOTS: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: screenshots/
          if-no-files-found: ignore

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
          - os: ubuntu-latest
            command: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build installers
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: A13 — no PDFs or user data inside the package
        run: npm run check:dist
      - name: A12 — E2E against the packaged app (launch, PDF import, save, restart)
        run: |
          BIN="$(node tools/packaged_bin.cjs)"
          echo "Testing $BIN"
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAJIMA_ELECTRON_BIN="$BIN" xvfb-run -a npm run test:e2e:electron
          else
            TAJIMA_ELECTRON_BIN="$BIN" npm run test:e2e:electron
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.AppImage
          if-no-files-found: error
