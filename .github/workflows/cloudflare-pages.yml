# スマホ版を Cloudflare Pages（aqros-mobile.pages.dev）へ自動公開する（任意）
# 次の Secrets がこのリポジトリに登録されているときだけ公開する。無ければ何もしない:
#   CLOUDFLARE_API_TOKEN（Pages 編集権限）, CLOUDFLARE_ACCOUNT_ID, AQROS_PRIVACY_PATTERNS（漏えい検査の検査語）
# 漏えい検査に不合格なら公開しない（scripts/deploy_cloudflare.py）。
name: cloudflare-pages

on:
  workflow_dispatch:
  push:
    branches: ["claude/air-quality-research-os-19gu2g"]
    paths: ["frontend/**", "knowledge/**", "report/**", "deliverables/technical_report_2026-11/**", "scripts/build_mobile.py", "scripts/deploy_cloudflare.py", "scripts/privacy_patterns.py"]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check secrets
        id: s
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          P: ${{ secrets.AQROS_PRIVACY_PATTERNS }}
        run: echo "ok=$([ -n "$T" ] && [ -n "$P" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == 'true'
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == 'true'
        with: { python-version: "3.13" }
      - name: Deploy
        if: steps.s.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AQROS_PRIVACY_PATTERNS: ${{ secrets.AQROS_PRIVACY_PATTERNS }}
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pip install -r backend/requirements.txt
          (cd frontend && npm ci)
          python scripts/deploy_cloudflare.py
      - name: Skipped
        if: steps.s.outputs.ok != 'true'
        run: echo "Cloudflare の Secrets が未登録のため公開しません（Claude Code のセッションからは scripts/deploy_cloudflare.py で公開できます）"
