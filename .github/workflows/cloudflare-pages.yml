# スマホ版を Cloudflare Pages（aqros-mobile.pages.dev）へ自動公開する（任意）
# 次の Secrets がこのリポジトリに登録されているときだけ公開する。無ければ何もしない:
#   CLOUDFLARE_API_TOKEN または既存名 AQUOSE（Cloudflare Pages 編集権限。必須）, CLOUDFLARE_ACCOUNT_ID（アカウントが 1 つなら省略可）,
#   AQROS_PRIVACY_PATTERNS（漏えい検査の検査語。任意）
# 公開前の検査（どちらかに合格しないと公開しない。scripts/deploy_cloudflare.py）:
#   - AQROS_PRIVACY_PATTERNS がある: 氏名リストでの漏えい検査（データを変えたときはこちらが必要）
#   - 無い: 「公開するデータが、いま公開中のものと 1 バイトも違わない」ことの確認（--data-unchanged。画面だけの変更用。
#           データが少しでも違えば公開しない）
name: cloudflare-pages

on:
  workflow_dispatch:
  push:
    branches: ["claude/air-quality-research-os-19gu2g"]
    paths: ["frontend/**", "knowledge/**", "report/**", "deliverables/technical_report_2026-11/**", "scripts/build_mobile.py", "scripts/deploy_cloudflare.py", "scripts/privacy_patterns.py", "scripts/verify_public_data_unchanged.py", ".github/workflows/cloudflare-pages.yml"]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check secrets
        id: s
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.AQUOSE }}
          P: ${{ secrets.AQROS_PRIVACY_PATTERNS }}
        run: |
          echo "ok=$([ -n "$T" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mode=$([ -n "$P" ] && echo private-list || echo data-unchanged)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == 'true'
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == 'true'
        with: { python-version: "3.13" }
      - name: Deploy
        if: steps.s.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.AQUOSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AQROS_PRIVACY_PATTERNS: ${{ secrets.AQROS_PRIVACY_PATTERNS }}
          MODE: ${{ steps.s.outputs.mode }}
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pip install -r backend/requirements.txt
          (cd frontend && npm ci)
          if [ "$MODE" = "private-list" ]; then
            python scripts/deploy_cloudflare.py
          else
            python scripts/deploy_cloudflare.py --data-unchanged
          fi
      - name: Skipped
        if: steps.s.outputs.ok != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / AQUOSE が未登録のため公開しません（リポジトリの Settings → Secrets and variables → Actions に登録して、このワークフローを再実行してください）"
