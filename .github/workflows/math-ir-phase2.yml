name: Math IR Phase 2 - Python Precision Handoff

on:
  pull_request:
    paths:
      - "math_interop_v0/**"
      - ".github/workflows/math-ir-phase2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned computation libraries
        run: |
          python -m pip install --disable-pip-version-check \
            'sympy==1.14.0' 'numpy==2.2.6' 'scipy==1.15.3' \
            'mpmath==1.3.0' 'duckdb==1.4.1'

      - name: Run isolated Stage 2 handoff and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase1.py self-test
          python math_interop_v0/phase2.py run \
            "$RUNNER_TEMP/math-ir-phase2-report.json" \
            "$RUNNER_TEMP/math-ir-phase2.duckdb"

      - name: Independently reopen saved artifacts and detect database tampering
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase2.py verify \
            "$RUNNER_TEMP/math-ir-phase2-report.json" \
            "$RUNNER_TEMP/math-ir-phase2.duckdb"

      - name: Upload synthetic audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-ir-stage2-synthetic-data
          path: |
            ${{ runner.temp }}/math-ir-phase2-report.json
            ${{ runner.temp }}/math-ir-phase2.duckdb
          if-no-files-found: ignore
          retention-days: 7