name: Math IR Phase 2 - Python Precision Handoff

on:
  pull_request:
    paths:
      - "math_interop_v0/**"
      - ".github/workflows/math-ir-phase2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned computation libraries
        run: |
          python -m pip install --disable-pip-version-check \
            'sympy==1.14.0' 'numpy==2.2.6' 'scipy==1.15.3' \
            'mpmath==1.3.0' 'duckdb==1.4.1'

      - name: Run isolated Stage 2 handoff and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase1.py self-test
          python math_interop_v0/phase2.py run \
            "$RUNNER_TEMP/math-ir-phase2-report.json" \
            "$RUNNER_TEMP/math-ir-phase2.duckdb"

      - name: Independently reopen saved artifacts and detect database tampering
        shell: bash
        run: |
          set -euo pipefail
          python math_interop_v0/phase2.py verify \
            "$RUNNER_TEMP/math-ir-phase2-report.json" \
            "$RUNNER_TEMP/math-ir-phase2.duckdb"

      - name: Copy computation outputs to Dropbox (no GitHub artifact quota)
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets not configured; outputs were NOT archived. No GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          for file in \
            $RUNNER_TEMP/math-ir-phase2-report.json \\
            $RUNNER_TEMP/math-ir-phase2.duckdb; do
            if [[ -f "$file" ]]; then
              python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$(basename "$file")"
              count=$((count+1))
            fi
          done
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then echo '::warning::No result files found to copy'; fi
