name: Math IR Phase 4 - Dependency DAG and Cache Audit

on:
  pull_request:
    paths:
      - 'math_interop_v0/**'
      - '.github/workflows/math-ir-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned five Python math/data engines
        run: |
          python -m pip install 'sympy==1.14.0' 'numpy==2.2.6' 'scipy==1.15.3' 'mpmath==1.3.0' 'duckdb==1.4.1'
      - name: Generate cold-cache baseline
        run: python math_interop_v0/phase4.py run "$RUNNER_TEMP/mathcache" "$RUNNER_TEMP/base1.json" base default
      - name: Re-run unchanged inputs in a NEW process (all cache hits)
        run: python math_interop_v0/phase4.py run "$RUNNER_TEMP/mathcache" "$RUNNER_TEMP/base2.json" base default
      - name: Change one exact source rational and test selective invalidation
        run: python math_interop_v0/phase4.py run "$RUNNER_TEMP/mathcache" "$RUNNER_TEMP/shifted.json" shifted default
      - name: Change NumPy version tag and test selective invalidation
        run: python math_interop_v0/phase4.py run "$RUNNER_TEMP/mathcache" "$RUNNER_TEMP/v2.json" base v2
      - name: Independently audit lineage, precise values, cache, DAG and tampering
        run: |
          python math_interop_v0/phase4.py audit \
            "$RUNNER_TEMP/mathcache" \
            "$RUNNER_TEMP/base1.json" \
            "$RUNNER_TEMP/base2.json" \
            "$RUNNER_TEMP/shifted.json" \
            "$RUNNER_TEMP/v2.json"
      - name: Copy computation outputs to Dropbox (no GitHub artifact quota)
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets not configured; outputs were NOT archived. No GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          for file in \
            $RUNNER_TEMP/base1.json \\
            $RUNNER_TEMP/base2.json \\
            $RUNNER_TEMP/shifted.json \\
            $RUNNER_TEMP/v2.json; do
            if [[ -f "$file" ]]; then
              python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$(basename "$file")"
              count=$((count+1))
            fi
          done
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then echo '::warning::No result files found to copy'; fi
