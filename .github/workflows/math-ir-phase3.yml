name: Math IR Phase 3 - Structured SageMath MATLAB Transfer

on:
  pull_request:
    paths:
      - 'math_interop_v0/**'
      - '.github/workflows/math-ir-phase3.yml'
      - 'scripts/dropbox_actions_store.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python engine
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Prepare restricted exact math input and manifest
        run: python math_interop_v0/phase3.py prepare math_ir_io
      - name: Compute SageMath independently from JSON
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --entrypoint /bin/bash \
            sagemath/sagemath:10.10 \
            -lc 'export PATH="/home/sage/sage/local/bin:$PATH"; exec sage -python /work/math_interop_v0/phase1.py sage' \
            < math_ir_io/input.json > math_ir_io/sage_result.json
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Symbolic_Math_Toolbox
      - name: Import SageMath JSON and independently compute in MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'math_interop_v0')); phase3_matlab"
      - name: Verify independent computations and negative tests
        run: |
          python math_interop_v0/phase3.py verify math_ir_io
          python math_interop_v0/phase3.py negative math_ir_io
      - name: Save complete synthetic math outputs to Dropbox
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets missing; no outputs archived; no GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          while IFS= read -r -d '' file; do
            python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$file"
            count=$((count+1))
          done < <(find math_ir_io -type f -print0)
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
