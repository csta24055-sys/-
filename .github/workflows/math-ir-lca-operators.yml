name: Math IR LCA Operators - Integral Time Mask Spectrum

on:
  pull_request:
    paths:
      - 'math_tools_v2/lca_ops.py'
      - 'math_tools_v2/test_lca_ops.py'
      - 'math_tools_v2/examples/lca_ops_demo.json'
      - '.github/workflows/math-ir-lca-operators.yml'
      - 'math_tools_v2/README-operators.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-four-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python mathematics dependencies
        run: python -m pip install --disable-pip-version-check -r math_tools_v2/requirements.txt
      - name: Check four operations, boundary semantics, exact coefficients and negative tests
        run: python -m unittest discover -s math_tools_v2 -p 'test_lca_ops.py' -v
      - name: Run direct JSON input as mathematical research candidate
        run: |
          python math_tools_v2/lca_ops.py run \
            math_tools_v2/examples/lca_ops_demo.json \
            "$RUNNER_TEMP/lca_ops_result.json"
          python math_tools_v2/lca_ops.py verify \
            math_tools_v2/examples/lca_ops_demo.json \
            "$RUNNER_TEMP/lca_ops_result.json"
      - name: Copy computation outputs to Dropbox (no GitHub artifact quota)
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_APP_KEY" || -z "$DROPBOX_APP_SECRET" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo '::warning::Dropbox secrets not configured; outputs were NOT archived. No GitHub artifact storage used.'
            exit 0
          fi
          remote_base="/GitHubActions/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          count=0
          for file in \
            $RUNNER_TEMP/lca_ops_result.json; do
            if [[ -f "$file" ]]; then
              python scripts/dropbox_actions_store.py --file "$file" --remote "$remote_base/$(basename "$file")"
              count=$((count+1))
            fi
          done
          echo "Dropbox copies verified: $count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then echo '::warning::No result files found to copy'; fi
