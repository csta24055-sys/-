# 第4回 山留土工事演習課題 — 入力条件（単一の情報源）
# 単位: 平面座標 mm（原点 = X1通り × Y2通り、x=東向き、y=北向き）、深さ m（GLから下向き正）
# status: confirmed = 資料で確定 / derived = 照合で導出 / assumed = 仮定 / unresolved = 未確定（null）
# 未確定値を null のまま残すと、run.py は最終成果物を「確定」として出力しない。

meta:
  title: "〇〇寮新築工事 根切図・根切断面図（Y3通り）・掘削土量"
  date: "2026-10-21"
  scale: 100           # 1/100

grid:
  x:                   # 通り芯 x座標 [mm]
    X1: 0
    X2: 5750
    X3: 11500
    X4: 17250
  y:
    Y2: 0
    Y3: 10800
  sources:
    - "総合指示書の既知寸法 X1-X2-X3-X4 = 5750 ×3 = 17250, Y2-Y3 = 10800（status: confirmed-by-instruction / 設計図PDF p.2で要再確認）"

levels:                # GL基準 [mm]、上向き正
  GL: 0
  1FL: 500             # 授業スライド 9:54「GL基準のレベル = FL基準のレベル + 500mm」(status: confirmed)

depth_classes:         # 根切り深さ [m]（GLから根切り底まで）
  base:    {depth: 1.65, status: confirmed, source: "授業スライド 10:04 方法B の基本掘削深さ 1.65"}
  general: {depth: 1.85, status: confirmed, source: "授業スライド 10:00 F3・F4・F5の一般部 床付け GL-1,850"}
  F4A:     {depth: 2.10, status: confirmed, source: "授業スライド 10:00 F4A(Y3・X2/X3) 床付け GL-2,100"}
  F3A:     {depth: 2.20, status: confirmed, source: "授業スライド 10:00 F3A(Y3・X1) 床付け GL-2,200"}

footings:              # 基礎下端・床付け（授業スライド 10:00）。平面寸法は設計図 p.5 基礎リストから要入力
  - {name: F3A, at: "Y3・X1",    bottom_GL_mm: -2100, subgrade_GL_mm: -2200, size_mm: null, status: unresolved-size}
  - {name: F4A, at: "Y3・X2/X3", bottom_GL_mm: -2000, subgrade_GL_mm: -2100, size_mm: null, status: unresolved-size}
  - {name: F3,  at: null,        bottom_GL_mm: -1750, subgrade_GL_mm: -1850, size_mm: null, status: unresolved-size}
  - {name: F4,  at: null,        bottom_GL_mm: -1750, subgrade_GL_mm: -1850, size_mm: null, status: unresolved-size}
  - {name: F5,  at: null,        bottom_GL_mm: -1750, subgrade_GL_mm: -1850, size_mm: null, status: unresolved-size,
     note: "特殊形状。矩形に置換しないこと（設計図 p.2/p.5）"}

sub_layers_mm:         # 基礎下：捨てコン50 + 砕石50 = 100（授業スライド 10:00 サブタイトル）
  blinding_concrete: 50
  crushed_stone: 50

# 根切り区画。polygon は [[x,y],...] (mm)。1つでも null があれば未完成扱い。
# 深さの異なる区画が重なってよい（各位置で最大深さを採用して重複計上しない）。
excavation:
  base_area:           # A0: 基本掘削（1.65m）範囲 = 根切り底の外形
    polygon: null
    status: unresolved
    note: "根切り外形（通り芯からの余掘り・作業余裕）は設計図/授業図で要確認"
  zones:               # 増掘り区画
    - {name: "F3A 増掘り", class: F3A, polygon: null, status: unresolved}
    - {name: "F4A 増掘り", class: F4A, polygon: null, status: unresolved}
    - {name: "一般基礎 増掘り", class: general, polygon: null, status: unresolved}

retaining:             # 課題文で指定（変更禁止）
  west:  open_cut
  south: open_cut
  north: open_cut
  east:  soldier_pile_lagging   # 親杭横矢板
  slope_ratio: null             # 法勾配 1:n の n（水平/鉛直）— 資料に記載なし。未確定
  include_slope_volume: null    # 法面部分を土量に含めるか — 授業例と要照合
  soldier_pile_x_mm: null       # 親杭芯の x 座標

answer_sheet:          # 元PDF 1ページ目の解答欄（PDF座標 pt, 左上原点）。--calibrate で特定
  pdf: "inputs/assignment/20261021_ 第4回_山留土工事演習問題及びサンプル設計図(演習課題)(1).pdf"
  page_index: 0
  plan_box: null
  section_box: null
  volume_text_at: null
  paper_scale_check: null       # 通り芯間隔の実測で 1/100 と一致するか
