<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>{{TITLE}}</title>
<style>
@page { size: A4; margin: 20mm 16mm 18mm 16mm; }
body { font-family: "IPAGothic","IPAPGothic",sans-serif; font-size: 10pt; line-height: 1.7; color:#111; background:#fff; }
.pb { break-after: page; }
.cover { height: 250mm; display:flex; flex-direction:column; justify-content:center; text-align:center; }
.cover-org { font-size: 12pt; letter-spacing: .2em; color:#333; margin-bottom: 18mm; }
.cover-title { font-size: 26pt; font-weight: bold; line-height:1.35; margin-bottom: 8mm; }
.cover-sub { font-size: 13pt; color:#333; margin-bottom: 30mm; }
.cover-meta { font-size: 11pt; margin-bottom: 20mm; }
.cover-note { font-size: 8.5pt; color:#444; text-align:left; border-top:1px solid #999; padding-top:4mm; }
h1 { font-size: 17pt; border-bottom: 2px solid #222; padding-bottom: 2mm; margin-top: 0; break-before: page; }
h1.part { font-size: 22pt; text-align:center; border:none; margin-top: 90mm; }
h2 { font-size: 13.5pt; border-bottom: 1px solid #888; margin-top: 1.4em; break-after: avoid; }
h3 { font-size: 11.5pt; margin-top: 1.2em; break-after: avoid; }
table { border-collapse: collapse; width: 100%; font-size: 8.3pt; margin: .5em 0 1em; break-inside: auto; }
tr { break-inside: avoid; }
th, td { border: 1px solid #888; padding: 2px 4px; vertical-align: top; }
th { background: #eee; }
caption { caption-side: top; text-align:left; font-weight:bold; font-size: 9pt; padding: 2px 0; }
pre, code { font-family: "IPAGothic", monospace; font-size: 8pt; white-space: pre-wrap; }
pre { background:#f5f5f5; padding: 4px 6px; }
blockquote { border-left: 3px solid #888; margin-left:0; padding-left: 8px; color:#333; }
.mermaid { text-align:center; margin: .6em 0 .2em; break-inside: avoid; }
.figcap { text-align:center; font-weight:bold; font-size:9pt; margin-bottom: 1em; }
.mk { font-size: 1px; color: #fff; }
#toc h1 { break-before: auto; } #lof h1 { break-before: page; }
.toc-line { display:flex; font-size: 9.5pt; line-height:1.55; }
.toc-line a { color:#111; text-decoration:none; }
.toc-line .dots { flex:1; border-bottom: 1px dotted #aaa; margin: 0 4px 5px; }
.toc-l1 { font-weight:bold; margin-top: 4px; }
.toc-l0 { font-weight:bold; font-size: 11pt; margin-top: 8px; }
.toc-l2 { padding-left: 1.5em; }
.toc-l3 { padding-left: 3em; font-size: 8.8pt; color:#333; }
.idx { columns: 2; font-size: 9pt; }
.idx div { break-inside: avoid; }
a { color: #1a4fa0; }
</style></head>
<body>
{{COVER}}
<main id="body">
{{BODY}}
</main>
</body></html>
