<svg class="fig" viewBox="0 0 250 112" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, IPAGothic, sans-serif" aria-label="上下水道と建築設備の責任分界点">
  <!-- 上水 -->
  <text x="2" y="9" font-size="7" font-weight="bold" fill="#1f5fa8">上水（給水）</text>
  <line x1="96" y1="12" x2="96" y2="50" stroke="#8a96a3" stroke-dasharray="2 1.5"/><text x="96" y="56" font-size="5.6" text-anchor="middle" fill="#4a5561">道路｜宅地</text>
  <circle cx="18" cy="34" r="7" fill="#d6e6f7" stroke="#1f5fa8"/><text x="18" y="48" font-size="5.8" text-anchor="middle" fill="#1f5fa8">配水管</text>
  <path d="M25 34 H118" stroke="#1f5fa8" stroke-width="2"/><text x="60" y="30" font-size="5.8" text-anchor="middle" fill="#1f5fa8">給水管</text>
  <rect x="118" y="28" width="16" height="12" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="126" y="24" font-size="6" text-anchor="middle" fill="#c0392b" font-weight="bold">水道メーター</text>
  <path d="M134 34 H170" stroke="#1f5fa8" stroke-width="2"/>
  <rect x="170" y="20" width="26" height="22" fill="#d6e6f7" stroke="#1f5fa8"/><text x="183" y="34" font-size="5.8" text-anchor="middle">受水槽等</text>
  <path d="M196 30 H206 V14 H246 V44 H206 V38" fill="none" stroke="#8a96a3"/><text x="226" y="32" font-size="6" text-anchor="middle">建物</text>
  <line x1="126" y1="26" x2="126" y2="46" stroke="#c0392b" stroke-width="1.2"/>
  <!-- 範囲 -->
  <path d="M18 60 V58 H125 V60" fill="none" stroke="#1f5fa8"/><text x="72" y="66" font-size="5.8" text-anchor="middle" fill="#1f5fa8">水道局（漏水修理範囲）</text>
  <path d="M127 60 V58 H246 V60" fill="none" stroke="#2e7d32"/><text x="186" y="66" font-size="5.8" text-anchor="middle" fill="#2e7d32">お客さま ＝ 建築設備</text>
  <!-- 下水 -->
  <text x="2" y="80" font-size="7" font-weight="bold" fill="#6d4c2f">下水（排水）</text>
  <path d="M4 84 H44 V104 H4z" fill="#fbfcfd" stroke="#8a96a3"/><text x="24" y="97" font-size="6" text-anchor="middle">建物</text>
  <path d="M44 96 H62" stroke="#6d4c2f" stroke-width="2"/>
  <rect x="62" y="90" width="12" height="12" fill="#efe6dc" stroke="#6d4c2f"/><text x="68" y="87" font-size="5.6" text-anchor="middle" fill="#6d4c2f">汚水ます</text>
  <path d="M74 96 H96" stroke="#6d4c2f" stroke-width="2"/>
  <rect x="96" y="90" width="12" height="12" fill="#efe6dc" stroke="#c0392b" stroke-width="1.4"/><text x="102" y="87" font-size="6" text-anchor="middle" fill="#c0392b" font-weight="bold">最終ます</text>
  <line x1="118" y1="82" x2="118" y2="106" stroke="#8a96a3" stroke-dasharray="2 1.5"/><text x="118" y="111" font-size="5.6" text-anchor="middle" fill="#4a5561">公私境界</text>
  <path d="M108 96 H128" stroke="#6d4c2f" stroke-width="2"/>
  <rect x="128" y="90" width="12" height="12" fill="#fff" stroke="#6d4c2f"/><text x="134" y="87" font-size="5.6" text-anchor="middle" fill="#6d4c2f">公共ます</text>
  <path d="M140 96 H200" stroke="#6d4c2f" stroke-width="2"/><text x="170" y="92" font-size="5.6" text-anchor="middle" fill="#6d4c2f">取付管</text>
  <circle cx="208" cy="96" r="8" fill="#fff" stroke="#6d4c2f" stroke-width="1.4"/><text x="232" y="99" font-size="5.8" text-anchor="middle" fill="#6d4c2f">下水道管</text>
  <text x="58" y="80" font-size="5.8" fill="#2e7d32">最終ますから宅地側 ＝ 建物側（建築設備）</text>
  <text x="246" y="80" font-size="5.8" text-anchor="end" fill="#1f5fa8">公共ます〜 ＝ 下水道局</text>
</svg>
