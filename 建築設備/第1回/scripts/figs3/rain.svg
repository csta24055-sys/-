<svg class="fig" viewBox="0 0 200 112" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, IPAGothic, sans-serif" aria-label="雨水利用と洪水の抑制">
  <defs>
    <marker id="ra-g" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7z" fill="#009E73"/></marker>
    <marker id="ra-k" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7z" fill="#555"/></marker>
  </defs>
  <!-- 雨 -->
  <g stroke="#56B4E9" stroke-width="1.2"><line x1="20" y1="3" x2="17" y2="10"/><line x1="34" y1="3" x2="31" y2="10"/><line x1="48" y1="3" x2="45" y2="10"/><line x1="62" y1="3" x2="59" y2="10"/></g>
  <text x="68" y="9" font-size="6.4" fill="#00704f">屋根の雨</text>
  <!-- 建物 -->
  <rect x="10" y="14" width="64" height="48" fill="#fafafa" stroke="#777"/>
  <line x1="0" y1="62" x2="104" y2="62" stroke="#8a6d3b" stroke-width="1.6"/>
  <text x="88" y="59" font-size="6" fill="#6b5428">地面</text>
  <path d="M74 16 H82 V84 H76" fill="none" stroke="#009E73" stroke-width="2" stroke-dasharray="5 2.5" marker-end="url(#ra-g)"/>
  
  <rect x="40" y="72" width="36" height="22" fill="#e3f5ee" stroke="#009E73" stroke-width="1.3"/>
  <text x="58" y="81" font-size="6.4" text-anchor="middle">雨水</text><text x="58" y="90" font-size="6.4" text-anchor="middle">貯留槽</text>
  <rect x="18" y="78" width="14" height="10" fill="#fff" stroke="#009E73"/><text x="25" y="98" font-size="6" text-anchor="middle" fill="#00704f">ろ過</text>
  <path d="M40 83 H32" stroke="#009E73" stroke-width="2" stroke-dasharray="5 2.5"/>
  <path d="M18 83 H14 V40 H22" fill="none" stroke="#009E73" stroke-width="2" stroke-dasharray="5 2.5" marker-end="url(#ra-g)"/>
  <path d="M24 32 h10 v8 h-3 q0 7 -7 7 h-0z" fill="#fff" stroke="#333"/>
  <text x="38" y="30" font-size="6.2">トイレの</text><text x="38" y="38" font-size="6.2">洗浄水に</text>
  <text x="38" y="50" font-size="6.2" fill="#D55E00">飲用不可</text>
  <path d="M50 96 v8 M58 96 v8 M66 96 v8" stroke="#555" stroke-width="1" marker-end="url(#ra-k)"/>
  <text x="71" y="103" font-size="5.8" fill="#444">地面に</text><text x="71" y="110" font-size="5.8" fill="#444">しみこませる</text>
  <!-- 右：比較 -->
  <rect x="108" y="2" width="91" height="50" rx="3" fill="#fff" stroke="#D55E00" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="112" y="13" font-size="7" fill="#D55E00" font-weight="bold">✕ 雨水を全部すぐ</text>
  <text x="112" y="22" font-size="7" fill="#D55E00" font-weight="bold">　下水道へ流すと</text>
  <text x="112" y="33" font-size="6.2">合流式（雨水と汚水が同じ</text>
  <text x="112" y="41" font-size="6.2">管）の下水道がパンクし、</text>
  <text x="112" y="49" font-size="6.2">洪水の原因になる</text>
  <rect x="108" y="58" width="91" height="52" rx="3" fill="#fff" stroke="#0072B2" stroke-width="1.2"/>
  <text x="112" y="69" font-size="7" fill="#0072B2" font-weight="bold">○ 敷地内で貯める・</text>
  <text x="112" y="78" font-size="7" fill="#0072B2" font-weight="bold">　しみこませる</text>
  <text x="112" y="89" font-size="6.2">下水道に一度に流れ込まない</text>
  <text x="112" y="97" font-size="6.2">＋ トイレに使えば</text>
  <text x="112" y="105" font-size="6.2">上水（水道水）の節約になる</text>
</svg>
