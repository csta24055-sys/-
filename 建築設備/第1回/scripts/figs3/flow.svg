<svg class="fig" viewBox="0 0 480 182" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, IPAGothic, sans-serif" aria-label="建物の中の水の流れ（上水・雨水/雑用水・排水・通気）">
  <defs>
    <marker id="fa-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#0072B2"/></marker>
    <marker id="fa-g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#009E73"/></marker>
    <marker id="fa-r" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#6B4423"/></marker>
    <marker id="fa-o" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#E69F00"/></marker>
  </defs>
  <!-- 地盤・建物 -->
  <rect x="96" y="40" width="294" height="126" fill="#fafafa" stroke="#777" stroke-width="1"/>
  <line x1="96" y1="82" x2="390" y2="82" stroke="#ccc"/>
  <line x1="0" y1="124" x2="480" y2="124" stroke="#8a6d3b" stroke-width="2"/>
  <text x="4" y="120" font-size="8.8" fill="#6b5428">地面</text>
  <text x="100" y="176" font-size="8.8" fill="#555">地下（機械室）</text>
  <text x="44" y="174" font-size="8.8" fill="#555">道路</text><text x="436" y="176" font-size="8.8" fill="#555" text-anchor="end">道路</text>

  <!-- 凡例 -->
  <g font-size="7.8">
    <line x1="4" y1="6" x2="22" y2="6" stroke="#0072B2" stroke-width="3"/><text x="25" y="8.6">上水（飲める水）</text>
    <line x1="4" y1="16" x2="22" y2="16" stroke="#009E73" stroke-width="2.4" stroke-dasharray="6 3"/><text x="25" y="18.6">雨水・雑用水（飲めない水）</text>
    <line x1="4" y1="26" x2="22" y2="26" stroke="#6B4423" stroke-width="4"/><text x="25" y="28.6">排水（使った水）</text>
    <line x1="4" y1="36" x2="22" y2="36" stroke="#555" stroke-width="1.6" stroke-dasharray="1.6 2.2"/><text x="25" y="38.6">通気管（空気の通り道）</text>
  </g>

  <!-- 上水 -->
  <circle cx="22" cy="146" r="9" fill="#e3f0fa" stroke="#0072B2" stroke-width="1.6"/>
  <text x="22" y="164" font-size="8.2" text-anchor="middle" fill="#0072B2">水道管</text><text x="22" y="172" font-size="8.2" text-anchor="middle" fill="#0072B2">（配水管）</text>
  <path d="M31 146 H108" stroke="#0072B2" stroke-width="3" fill="none"/>
  <path d="M44 146 h8" stroke="#0072B2" stroke-width="3" marker-end="url(#fa-b)"/>
  <rect x="62" y="139" width="14" height="14" fill="#fff" stroke="#0072B2" stroke-width="1.6"/>
  <text x="69" y="134" font-size="8.5" text-anchor="middle" fill="#0072B2">水道メーター</text>
  <rect x="108" y="132" width="40" height="26" fill="#e3f0fa" stroke="#0072B2" stroke-width="1.4"/>
  <text x="128" y="148" font-size="9.2" text-anchor="middle" font-weight="bold">受水槽</text>
  <path d="M148 150 H156" stroke="#0072B2" stroke-width="3"/>
  <circle cx="162" cy="150" r="6" fill="#fff" stroke="#0072B2" stroke-width="1.6"/><path d="M159 147 l6 3 l-6 3z" fill="#0072B2"/>
  <text x="172" y="160" font-size="8.5" fill="#0072B2">ポンプ</text>
  <path d="M162 144 V30 H170" stroke="#0072B2" stroke-width="3" fill="none"/>
  <path d="M162 110 v-12" stroke="#0072B2" stroke-width="3" marker-end="url(#fa-b)"/>
  <text x="158" y="78" font-size="8.2" fill="#0072B2" text-anchor="end">くみ上げ</text>
  <rect x="170" y="16" width="46" height="20" fill="#e3f0fa" stroke="#0072B2" stroke-width="1.4"/>
  <text x="193" y="29" font-size="9.2" text-anchor="middle" font-weight="bold">高置水槽</text>
  <text x="193" y="11" font-size="8.2" text-anchor="middle" fill="#0072B2">屋上</text>
  <path d="M206 36 V108" stroke="#0072B2" stroke-width="3" fill="none"/>
  <path d="M206 44 v12" stroke="#0072B2" stroke-width="3" marker-end="url(#fa-b)"/>
  <path d="M206 58 H222 M206 100 H222" stroke="#0072B2" stroke-width="2.2"/>
  <text x="201" y="70" font-size="8.2" fill="#0072B2" text-anchor="end">重力で</text><text x="201" y="79" font-size="8.2" fill="#0072B2" text-anchor="end">各階へ</text>
  <!-- 洗面台 -->
  <g fill="#fff" stroke="#333" stroke-width="1.1">
    <path d="M218 62 h24 v4 a6 6 0 0 1 -6 6 h-12 a6 6 0 0 1 -6 -6z"/>
    <path d="M218 104 h24 v4 a6 6 0 0 1 -6 6 h-12 a6 6 0 0 1 -6 -6z"/>
  </g>
  <text x="230" y="56" font-size="8.5" text-anchor="middle">洗面台</text>
  <!-- トラップ＆排水 -->
  <path d="M230 72 v4 a4 4 0 0 0 8 0 a4 4 0 0 1 8 0 v2 H262" fill="none" stroke="#6B4423" stroke-width="2.6"/>
  <path d="M230 114 v4 a4 4 0 0 0 8 0 a4 4 0 0 1 8 0 v2 H262" fill="none" stroke="#6B4423" stroke-width="2.6"/>
  <path d="M231 76 a3 3 0 0 0 6 0z" fill="#56B4E9"/><path d="M231 118 a3 3 0 0 0 6 0z" fill="#56B4E9"/>
  <text x="226" y="93" font-size="8.2" fill="#6B4423">トラップ</text>
  <path d="M262 50 V132 H404" stroke="#6B4423" stroke-width="4.2" fill="none"/>
  <path d="M262 92 v12" stroke="#6B4423" stroke-width="4.2" marker-end="url(#fa-r)"/>
  <path d="M384 132 h8" stroke="#6B4423" stroke-width="4.2" marker-end="url(#fa-r)"/>
  <text x="267" y="143" font-size="8.2" fill="#6B4423">排水管</text>
  <!-- 通気管 -->
  <path d="M262 118 L274 112 V8" stroke="#555" stroke-width="1.6" stroke-dasharray="1.6 2.2" fill="none"/>
  <path d="M280 52 v-14" stroke="#E69F00" stroke-width="1.6" marker-end="url(#fa-o)"/>
  <text x="283" y="47" font-size="8.2" fill="#a86b00">空気</text>
  <text x="278" y="14" font-size="8.5" fill="#333">通気管</text>
  <!-- トイレ（雑用水） -->
  <g fill="#fff" stroke="#333" stroke-width="1.1">
    <path d="M296 62 h14 v10 h-4 q0 8 -8 8 h-2z"/><path d="M296 104 h14 v10 h-4 q0 8 -8 8 h-2z"/>
  </g>
  <text x="303" y="56" font-size="8.5" text-anchor="middle">トイレ</text>
  <path d="M299 80 V86 H262 M299 122 V128 H262" fill="none" stroke="#6B4423" stroke-width="2.6"/>
  <!-- 雨水 -->
  <rect x="368" y="36" width="12" height="5" fill="#009E73"/>
  <text x="374" y="30" font-size="8.5" text-anchor="middle" fill="#00704f">屋根の雨</text>
  <path d="M374 41 V150 H366" stroke="#009E73" stroke-width="2.4" stroke-dasharray="6 3" fill="none"/>
  <path d="M374 70 v12" stroke="#009E73" stroke-width="2.4" marker-end="url(#fa-g)"/>
  <rect x="328" y="138" width="38" height="24" fill="#e3f5ee" stroke="#009E73" stroke-width="1.4"/>
  <text x="347" y="148" font-size="8.5" text-anchor="middle">雨水</text><text x="347" y="158" font-size="8.5" text-anchor="middle">貯留槽</text>
  <path d="M328 150 H318 V66 H310 M318 108 H310" stroke="#009E73" stroke-width="2.4" stroke-dasharray="6 3" fill="none"/>
  <path d="M318 104 v-12" stroke="#009E73" stroke-width="2.4" marker-end="url(#fa-g)"/>
  <text x="322" y="100" font-size="8.2" fill="#00704f">ろ過して</text><text x="322" y="109" font-size="8.2" fill="#00704f">洗浄水に</text>
  <!-- 最終ます・下水道 -->
  <rect x="404" y="124" width="20" height="18" fill="#f3ebe2" stroke="#6B4423" stroke-width="1.6"/>
  <text x="414" y="119" font-size="8.5" text-anchor="middle" fill="#6B4423">最終ます</text>
  <path d="M424 133 H436 V148 H446" stroke="#6B4423" stroke-width="4.2" fill="none"/>
  <circle cx="456" cy="148" r="10" fill="#fff" stroke="#6B4423" stroke-width="1.8"/>
  <text x="456" y="168" font-size="8.2" text-anchor="middle" fill="#6B4423">下水道管</text>
</svg>
