<svg class="fig" viewBox="0 0 200 84" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, IPAGothic, sans-serif" aria-label="貯湯タンクの温度と細菌">
  <rect x="1" y="1" width="96" height="82" rx="4" fill="#fff" stroke="#D55E00" stroke-width="1.3" stroke-dasharray="4 2"/>
  <text x="49" y="13" font-size="7.6" text-anchor="middle" fill="#D55E00" font-weight="bold">✕ 40℃のまま貯める</text>
  <rect x="24" y="20" width="50" height="38" rx="5" fill="#fde9dc" stroke="#555"/>
  <text x="49" y="36" font-size="7" text-anchor="middle">貯湯タンク</text>
  <text x="49" y="49" font-size="9" text-anchor="middle" font-weight="bold">40℃</text>
  <g fill="#D55E00"><circle cx="30" cy="26" r="1.6"/><circle cx="68" cy="27" r="1.6"/><circle cx="29" cy="54" r="1.6"/><circle cx="69" cy="53" r="1.6"/><circle cx="43" cy="55" r="1.3"/><circle cx="57" cy="23" r="1.3"/></g>
  <text x="49" y="69" font-size="6.6" text-anchor="middle">細菌が活動しやすい温度</text>
  <text x="49" y="78" font-size="6.6" text-anchor="middle" fill="#D55E00">→ レジオネラ属菌が増える</text>
  <rect x="103" y="1" width="96" height="82" rx="4" fill="#fff" stroke="#0072B2" stroke-width="1.3"/>
  <text x="151" y="13" font-size="7.6" text-anchor="middle" fill="#0072B2" font-weight="bold">○ 65℃以上で貯める</text>
  <rect x="124" y="20" width="54" height="38" rx="5" fill="#fbd3c0" stroke="#555"/>
  <text x="151" y="36" font-size="7" text-anchor="middle">貯湯タンク</text>
  <text x="151" y="49" font-size="9" text-anchor="middle" font-weight="bold">65℃以上</text>
  <text x="151" y="69" font-size="6.6" text-anchor="middle">温度を上げて貯める</text>
  <text x="151" y="78" font-size="6.6" text-anchor="middle" fill="#0072B2">→ 細菌を発生させない</text>
</svg>
