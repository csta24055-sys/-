<svg class="fig" viewBox="0 0 400 136" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, IPAGothic, sans-serif" aria-label="通気管がある場合とない場合の比較">
  <defs>
    <marker id="ta-b" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#0072B2"/></marker>
    <marker id="ta-o" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#E69F00"/></marker>
    <marker id="ta-v" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#D55E00"/></marker>
  </defs>
  <!-- ===== 左：正常 ===== -->
  <rect x="1" y="1" width="196" height="134" rx="4" fill="#fff" stroke="#0072B2" stroke-width="1.4"/>
  <rect x="1" y="1" width="196" height="17" rx="4" fill="#0072B2"/>
  <text x="99" y="13.5" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">○ 通気管あり：封水が守られる</text>
  <path d="M14 30 h34 v6 a10 10 0 0 1 -10 10 h-14 a10 10 0 0 1 -10 -10z" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="31" y="27" font-size="7" text-anchor="middle">洗面台</text>
  <path d="M31 46 v16 a9 9 0 0 0 18 0 v-4 a9 9 0 0 1 18 0 v8 h32" fill="none" stroke="#6B4423" stroke-width="3.4"/>
  <path d="M32.7 56 v6 a7.3 7.3 0 0 0 14.6 0 v-6z" fill="#56B4E9"/>
  <line x1="32.7" y1="56" x2="47.3" y2="56" stroke="#0072B2" stroke-width="1"/>
  <text x="20" y="84" font-size="7.6" fill="#0072B2" font-weight="bold">封水</text>
  <text x="8" y="94" font-size="6.6" fill="#0072B2">（たまった水＝ふた）</text>
  <text x="70" y="61" font-size="6.6" fill="#6B4423">トラップ</text>
  <line x1="100" y1="24" x2="100" y2="132" stroke="#6B4423" stroke-width="5"/>
  <text x="104" y="129" font-size="6.6" fill="#6B4423">排水立て管</text>
  <path d="M95 30 v22" stroke="#0072B2" stroke-width="1.8" marker-end="url(#ta-b)"/>
  <text x="91" y="30" font-size="6.6" fill="#0072B2" text-anchor="end">水が落ちる</text>
  <path d="M100 104 L128 92 V22" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="2 2.4"/>
  <text x="131" y="28" font-size="7" fill="#333">通気管</text>
  <path d="M136 92 v-40" stroke="#E69F00" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#ta-o)"/>
  <text x="140" y="62" font-size="6.8" fill="#a86b00">空気が</text>
  <text x="140" y="71" font-size="6.8" fill="#a86b00">上へ逃げる</text>
  <!-- 下水のにおい：止まる -->
  <path d="M96 126 L60 76" stroke="#D55E00" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#ta-v)"/>
  <text x="8" y="114" font-size="6.6" fill="#D55E00">下水管のにおい・虫は</text>
  <text x="8" y="125" font-size="7.8" fill="#D55E00" font-weight="bold">✕ 封水で止まる</text>
  <!-- ===== 右：問題 ===== -->
  <rect x="203" y="1" width="196" height="134" rx="4" fill="#fff" stroke="#D55E00" stroke-width="1.4" stroke-dasharray="5 2"/>
  <rect x="203" y="1" width="196" height="17" rx="4" fill="#D55E00"/>
  <text x="301" y="13.5" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">✕ 通気管なし：封水が失われる</text>
  <path d="M216 30 h34 v6 a10 10 0 0 1 -10 10 h-14 a10 10 0 0 1 -10 -10z" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <path d="M233 46 v16 a9 9 0 0 0 18 0 v-4 a9 9 0 0 1 18 0 v8 h48" fill="none" stroke="#6B4423" stroke-width="3.4"/>
  <path d="M234.7 64 v-2 a7.3 7.3 0 0 0 14.6 0 v2 a7.3 7.3 0 0 1 -14.6 0z" fill="#56B4E9"/>
  <g fill="#56B4E9"><circle cx="236" cy="24" r="2"/><circle cx="243" cy="20" r="1.8"/><circle cx="248" cy="26" r="1.6"/></g>
  <text x="254" y="27" font-size="6.6" fill="#0072B2">封水が飛び出す</text>
  <text x="208" y="84" font-size="6.6" fill="#0072B2">吸い込まれて</text>
  <text x="208" y="93" font-size="6.6" fill="#0072B2">水がなくなる</text>
  <line x1="318" y1="24" x2="318" y2="132" stroke="#6B4423" stroke-width="5"/>
  <path d="M313 30 v22" stroke="#0072B2" stroke-width="1.8" marker-end="url(#ta-b)"/>
  <text x="325" y="40" font-size="6.6" fill="#0072B2">水と固形物が</text>
  <text x="325" y="49" font-size="6.6" fill="#0072B2">流れ落ちる</text>
  <text x="325" y="74" font-size="7" fill="#333" font-weight="bold">空気の逃げ場</text>
  <text x="325" y="84" font-size="7" fill="#333" font-weight="bold">がない</text>
  <text x="325" y="96" font-size="6.6" fill="#333">→ 管内の圧力が</text>
  <text x="325" y="105" font-size="6.6" fill="#333">上がる・変動する</text>
  <path d="M302 128 L252 72" stroke="#D55E00" stroke-width="2" marker-end="url(#ta-v)"/>
  <path d="M244 52 V34" stroke="#D55E00" stroke-width="2" marker-end="url(#ta-v)"/>
  <text x="208" y="114" font-size="7.8" fill="#D55E00" font-weight="bold">においや虫が</text>
  <text x="208" y="125" font-size="7.8" fill="#D55E00" font-weight="bold">室内に入る</text>
</svg>
