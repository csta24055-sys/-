<svg class="fig" viewBox="0 0 340 176" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, IPAGothic, sans-serif" aria-label="封水があるときとないとき">
  <defs>
    <marker id="t-v" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14z" fill="#D55E00"/></marker>
  </defs>
  <!-- 左 -->
  <rect x="2" y="2" width="164" height="172" rx="6" fill="#fff" stroke="#0072B2" stroke-width="2.4"/>
  <text x="84" y="22" font-size="12" text-anchor="middle" fill="#0072B2" font-weight="bold">○ 水がたまっている</text>
  <path d="M30 40 h52 v8 a14 14 0 0 1 -14 14 h-24 a14 14 0 0 1 -14 -14z" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="56" y="36" font-size="9" text-anchor="middle">洗面台</text>
  <path d="M56 62 v24 a14 14 0 0 0 28 0 v-6 a14 14 0 0 1 28 0 v76" fill="none" stroke="#6B4423" stroke-width="6"/>
  <path d="M59 79 v7 a11 11 0 0 0 22 0 v-7z" fill="#56B4E9"/>
  <line x1="59" y1="79" x2="81" y2="79" stroke="#0072B2" stroke-width="1.6"/>
  <text x="44" y="122" font-size="11" fill="#0072B2" font-weight="bold">封水</text>
  <text x="18" y="136" font-size="9" fill="#0072B2">（水のふた）</text>
  <defs><marker id="t-v2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#D55E00"/></marker></defs>
  <path d="M112 166 V80 a14 14 0 0 0 -27 -2" fill="none" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="6 3" marker-end="url(#t-v2)"/>
  <text x="120" y="150" font-size="9" fill="#D55E00">下水の</text>
  <text x="120" y="162" font-size="9" fill="#D55E00">におい</text>
  <text x="62" y="74" font-size="13" fill="#D55E00" font-weight="bold">✕</text>
  <text x="100" y="56" font-size="10" fill="#333" font-weight="bold">水で止まる</text>
  <!-- 右 -->
  <rect x="174" y="2" width="164" height="172" rx="6" fill="#fff" stroke="#D55E00" stroke-width="2.4" stroke-dasharray="8 3"/>
  <text x="256" y="22" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="bold">✕ 水がなくなると</text>
  <path d="M202 40 h52 v8 a14 14 0 0 1 -14 14 h-24 a14 14 0 0 1 -14 -14z" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M228 62 v24 a14 14 0 0 0 28 0 v-6 a14 14 0 0 1 28 0 v76" fill="none" stroke="#6B4423" stroke-width="6"/>
  <path d="M284 164 V90 a12 12 0 0 0 -24 0 v4 a12 12 0 0 1 -24 0 V40" fill="none" stroke="#D55E00" stroke-width="3" marker-end="url(#t-v)"/>
  <text x="292" y="130" font-size="9" fill="#D55E00">下水の</text>
  <text x="292" y="142" font-size="9" fill="#D55E00">におい</text>
  <text x="186" y="130" font-size="10" fill="#D55E00" font-weight="bold">においや虫が</text>
  <text x="186" y="144" font-size="10" fill="#D55E00" font-weight="bold">部屋に入る</text>
</svg>
